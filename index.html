<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Mexicanen! Scoreboard Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c0a09">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mexicanen Pro">
    <link class="apple-touch-icon" href="icon-512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        html, body { overscroll-behavior-y: none; }
        #live-log-container::-webkit-scrollbar { width: 4px; }
        #live-log-container::-webkit-scrollbar-thumb { background-color: #78716c; border-radius: 2px; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-modal { animation: fadeIn 0.15s ease-out forwards; }
    </style>
</head>
<body class="bg-stone-950 text-stone-100 font-sans min-h-screen flex flex-col justify-between p-3 select-none">

    <div id="custom-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-stone-900 border border-amber-600/40 rounded-2xl w-full max-w-sm p-5 shadow-2xl flex flex-col gap-4 text-center animate-modal">
            <div id="modal-icon" class="flex justify-center items-center"></div>
            <p id="modal-message" class="text-stone-200 font-bold text-sm leading-relaxed"></p>
            <input type="number" id="modal-input" class="hidden bg-stone-800 border border-stone-700 rounded-lg px-3 py-2.5 text-white font-black text-center focus:outline-none focus:ring-2 focus:ring-amber-500 text-lg w-full">
            <div class="flex gap-2 justify-center mt-2">
                <button id="modal-btn-cancel" class="hidden bg-stone-800 hover:bg-stone-750 text-stone-400 font-bold px-4 py-2.5 rounded-xl text-xs uppercase tracking-wider border border-stone-700 transition w-full">Cancelar</button>
                <button id="modal-btn-confirm" class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-black px-4 py-2.5 rounded-xl text-xs uppercase tracking-wider border-b-2 border-amber-800 transition w-full">Aceptar</button>
            </div>
        </div>
    </div>

    <div id="setup-screen" class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between">
        <div>
            <div class="text-center my-3">
                <div class="flex justify-center items-center gap-3 mb-2">
                    <svg class="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M12 22V2 M12 14h-3.5a2 2 0 0 1-2-2V8 M12 11h3.5a2 2 0 0 0 2-2V5 M9 22h6 M9.5 8l1.5-1 M13 6l1.5 1" />
                    </svg>
                    <svg class="w-7 h-7 text-orange-500" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M2 17c2-1.5 5-2 10-2s8 .5 10 2 M2 17c1 2 4 2.5 10 2.5s9-.5 10-2.5 M7 15.5V13c0-2.5 1.5-4 3.5-4h3c2 0 3.5 1.5 3.5 4v2.5 M7.5 13.5h9" />
                    </svg>
                    <svg class="w-7 h-7 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <rect x="3" y="3" width="18" height="18" rx="2" />
                        <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
                        <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/>
                        <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
                    </svg>
                </div>
                <div class="h-1 bg-gradient-to-r from-rose-500 via-amber-500 via-emerald-500 to-indigo-500 rounded my-2"></div>
                <h1 class="text-3xl font-black text-amber-500 tracking-wider uppercase drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">¡Mexicanen! Pro</h1>
                <p class="text-xs font-bold text-stone-300 tracking-wide uppercase">Configuración de la Fiesta</p>
            </div>
            
            <div class="bg-stone-900 p-3 rounded-xl shadow-xl border border-amber-900/30 mb-4 flex flex-col gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
                        <span>Límite de puntos (Predeterminado 10)</span>
                    </label>
                    <input type="number" id="target-score-input" value="10" min="1" max="99"
                        class="w-20 bg-stone-800 border border-stone-700 rounded-lg px-3 py-1.5 text-white font-bold text-center focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-amber-400 uppercase tracking-wider mb-1 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        <span>Añadir Nuevo Jugador</span>
                    </label>
                    <div class="flex gap-2">
                        <input type="text" id="player-input" placeholder="Nombre del jugador..." autocomplete="off"
                            class="flex-1 bg-stone-800 border border-stone-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                        <button onclick="addPlayer()" 
                            class="bg-amber-600 hover:bg-amber-500 text-stone-950 font-black px-4 py-2 rounded-lg transition active:scale-95 text-lg">
                            +
                        </button>
                    </div>
                </div>
                <div class="h-1 w-full opacity-10" style="background-image: radial-gradient(circle, #a8a29e 1px, transparent 1px); background-size: 8px 8px;"></div>
            </div>

            <h2 class="text-xs font-bold uppercase tracking-wider mb-2 text-stone-400">Jugadores en la mesa (La Lista Negra):</h2>
            <ul id="player-list" class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                </ul>
        </div>

        <div class="space-y-2 mt-4">
            <button onclick="startGame()" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-black py-3 rounded-xl text-lg shadow-lg transition active:scale-95 uppercase tracking-widest border-b-4 border-emerald-800 flex justify-center items-center gap-2">
                <span>¡Iniciar Fiesta!</span>
            </button>
            <button onclick="showScreen('history-screen')" 
                class="w-full bg-stone-900 hover:bg-stone-800 text-amber-400 font-bold py-2.5 rounded-xl border border-stone-800 transition text-xs uppercase tracking-wider flex justify-center items-center gap-2">
                <span>Ver Historial (El Muro)</span>
            </button>
        </div>
    </div>


    <div id="game-screen" class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between hidden">
        <div>
            <div class="flex justify-between items-center my-2 border-b border-stone-800 pb-1.5 relative">
                <h1 class="text-lg font-black text-amber-500 uppercase tracking-wider flex items-center gap-1">
                    <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M12 22V2 M12 14h-3.5a2 2 0 0 1-2-2V8 M12 11h3.5a2 2 0 0 0 2-2V5 M9 22h6 M9.5 8l1.5-1 M13 6l1.5 1" />
                    </svg>
                    <span>¡El Scoreboard!</span>
                </h1>
                <span id="score-limit-display" class="text-[9px] bg-rose-950 text-rose-400 px-2 py-0.5 rounded-full border border-rose-800/60 font-bold uppercase tracking-wider">
                    Límite: 10
                </span>
                <div class="absolute -bottom-1 left-0 right-0 h-1 bg-gradient-to-r from-emerald-500 via-rose-500 via-amber-500 to-indigo-500 rounded"></div>
            </div>
            
            <div id="scoreboard-container" class="space-y-1.5 max-h-[50vh] overflow-y-auto pr-1 mt-2">
                </div>

            <div class="mt-3 bg-stone-900/60 border border-stone-800/80 rounded-xl p-2 flex flex-col">
                <h3 class="text-[10px] font-bold text-stone-400 uppercase tracking-wider mb-1">
                    Registro de Acciones (Línea de Tiempo)
                </h3>
                <div id="live-log-container" class="space-y-1 max-h-24 overflow-y-auto text-[11px] pr-1">
                    </div>
                <div id="log-resizer" class="h-2.5 cursor-ns-resize bg-stone-800/50 hover:bg-amber-500/40 transition-colors rounded mt-2 flex items-center justify-center touch-none">
                    <div class="w-8 h-0.5 bg-stone-600 rounded"></div>
                </div>
            </div>
        </div>

        <div class="mt-3 flex gap-2">
            <button onclick="undoLastAction()" title="Laatste actie ongedaan maken"
                class="bg-stone-900 hover:bg-stone-800 text-stone-400 border border-stone-800 font-bold px-4 py-3 rounded-xl text-base shadow-lg transition active:scale-95 flex items-center justify-center">
                <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 0 1 0 12h-3"/></svg>
            </button>
            <button id="end-game-btn" onclick="endGame()" 
                class="flex-1 bg-stone-800 text-stone-400 font-black py-3 rounded-xl text-sm shadow-lg transition uppercase tracking-widest border-b-4 border-stone-900 flex justify-center items-center gap-2">
                <span>Terminar Ronda</span>
            </button>
        </div>
    </div>


    <div id="history-screen" class="w-full max-w-md mx-auto flex-1 flex flex-col justify-between hidden">
        <div>
            <h1 class="text-xl font-black text-center text-amber-500 my-4 tracking-wide uppercase flex items-center justify-center gap-2">
                <svg class="w-5 h-5 text-rose-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.8 1.6 5.1 4 6.3V19a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-3.7c2.4-1.2 4-3.5 4-6.3a7 7 0 0 0-7-7zm-2.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
                <span>El Muro de los Perdedores</span>
            </h1>
            
            <div id="history-container" class="space-y-2 max-h-[68vh] overflow-y-auto pr-1">
                </div>
        </div>

        <div class="space-y-2 mt-4">
            <button onclick="exportHistory()" 
                class="w-full bg-amber-600 hover:bg-amber-500 text-stone-950 font-black py-3 rounded-xl shadow-lg transition active:scale-95 uppercase tracking-wider flex justify-center items-center gap-2 border-b-4 border-amber-800 text-sm">
                <svg class="w-4 h-4 text-stone-950 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                <span>Exportar para Python (JSON)</span>
            </button>
            <div class="flex gap-2">
                <button onclick="showScreen('setup-screen')" 
                    class="flex-1 bg-stone-900 hover:bg-stone-800 text-stone-200 font-bold py-2 rounded-xl border border-stone-800 transition uppercase tracking-wider text-[10px] flex justify-center items-center gap-1">
                    <span>Menú (Volver)</span>
                </button>
                <button onclick="clearHistory()" 
                    class="bg-rose-950/40 text-rose-400 border border-rose-900/50 hover:bg-rose-950/80 px-3 py-2 rounded-xl text-[10px] uppercase tracking-wider font-bold transition">
                    Limpiar datos
                </button>
            </div>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mexicanen_players')) || [];
        let scores = {};
        let gameTimeline = []; 
        let currentRoundLog = []; 
        let activeCharts = {}; 
        let targetScore = 10; 
        let history = JSON.parse(localStorage.getItem('mexicanen_timeline_history')) || [];

        // --- CENTRAL MATERIAL SVG DICTIONARY FOR MODALS ---
        const ICONS = {
            target: `<svg class="w-9 h-9 text-amber-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>`,
            person: `<svg class="w-9 h-9 text-amber-500 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`,
            group: `<svg class="w-9 h-9 text-amber-500 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 1.34 5 3s1.34 3 8 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>`,
            dice: `<svg class="w-9 h-9 text-amber-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>`,
            undo: `<svg class="w-9 h-9 text-stone-400 mx-auto" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 0 1 0 12h-3"/></svg>`,
            skull: `<svg class="w-9 h-9 text-rose-500 mx-auto" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 2.8 1.6 5.1 4 6.3V19a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-3.7c2.4-1.2 4-3.5 4-6.3a7 7 0 0 0-7-7zm-2.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>`,
            help: `<svg class="w-9 h-9 text-amber-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16h.01M12 7a3 3 0 0 1 3 3c0 2-3 3-3 3"/></svg>`,
            trash: `<svg class="w-9 h-9 text-rose-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"/></svg>`,
            box: `<svg class="w-9 h-9 text-amber-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 7.5L12 12M21 7.5v9l-9 5.25m9-14.25L12 2.25M12 12L3 7.5m9 4.5V22m0-10L3 7.5m0 0v9L12 22"/></svg>`,
            warning: `<svg class="w-9 h-9 text-rose-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`,
            cactus: `<svg class="w-9 h-9 text-emerald-500 mx-auto" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M12 22V2 M12 14h-3.5a2 2 0 0 1-2-2V8 M12 11h3.5a2 2 0 0 0 2-2V5 M9 22h6 M9.5 8l1.5-1 M13 6l1.5 1" /></svg>`
        };

        function showScreen(screenId) {
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('history-screen').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
            if (screenId === 'history-screen') renderHistory();
        }

        // --- UPDATED: SYSTEM FOR CUSTOM DIALOG MODALS WITH SVGs ---
        function showModal({ message, icon = 'cactus', type = 'alert', defaultValue = '' }) {
            return new Promise((resolve) => {
                const modal = document.getElementById('custom-modal');
                const msgEl = document.getElementById('modal-message');
                const iconEl = document.getElementById('modal-icon');
                const inputEl = document.getElementById('modal-input');
                const btnCancel = document.getElementById('modal-btn-cancel');
                const btnConfirm = document.getElementById('modal-btn-confirm');

                msgEl.innerText = message;
                iconEl.innerHTML = ICONS[icon] || ICONS['cactus'];
                
                inputEl.classList.add('hidden');
                btnCancel.classList.add('hidden');
                
                if (type === 'confirm') {
                    btnCancel.classList.remove('hidden');
                    btnCancel.innerText = 'No / Cancelar';
                    btnConfirm.innerText = 'Sí / Aceptar';
                } else if (type === 'prompt') {
                    inputEl.classList.remove('hidden');
                    inputEl.value = defaultValue;
                    btnCancel.classList.remove('hidden');
                    btnCancel.innerText = 'Cancelar';
                    btnConfirm.innerText = 'Aceptar';
                    setTimeout(() => inputEl.focus(), 50); 
                } else {
                    btnConfirm.innerText = '¡Órale!';
                }

                modal.classList.remove('hidden');

                function cleanup(value) {
                    modal.classList.add('hidden');
                    btnConfirm.removeEventListener('click', onConfirm);
                    btnCancel.removeEventListener('click', onCancel);
                    inputEl.removeEventListener('keypress', onKeyPress);
                    resolve(value);
                }

                function onConfirm() {
                    if (type === 'prompt') cleanup(inputEl.value);
                    else cleanup(true);
                }

                function onCancel() {
                    if (type === 'prompt') cleanup(null);
                    else cleanup(false);
                }

                function onKeyPress(e) {
                    if (e.key === 'Enter') onConfirm();
                }

                btnConfirm.addEventListener('click', onConfirm);
                btnCancel.addEventListener('click', onCancel);
                if (type === 'prompt') inputEl.addEventListener('keypress', onKeyPress);
            });
        }

        // --- TRAFFIC LIGHT LOGIC ---
        function getScoreColor(score, target) {
            let p = Math.min(1, Math.max(0, score / target));
            let r, g, b;
            if (p <= 0.33) {
                let stopP = p / 0.33;
                r = Math.round(16 + (234 - 16) * stopP);
                g = Math.round(185 + (179 - 185) * stopP);
                b = Math.round(129 + (8 - 129) * stopP);
            } else if (p <= 0.66) {
                let stopP = (p - 0.33) / 0.33;
                r = Math.round(234 + (249 - 234) * stopP);
                g = Math.round(179 + (115 - 179) * stopP);
                b = Math.round(8 + (22 - 8) * stopP);
            } else {
                let stopP = (p - 0.66) / 0.34;
                r = Math.round(249 + (244 - 249) * stopP);
                g = Math.round(115 + (63 - 115) * stopP);
                b = Math.round(22 + (94 - 22) * stopP);
            }
            return `rgb(${r}, ${g}, ${b})`;
        }

        function saveActiveGame() {
            localStorage.setItem('mexicanen_game_active', 'true');
            localStorage.setItem('mexicanen_current_scores', JSON.stringify(scores));
            localStorage.setItem('mexicanen_current_timeline', JSON.stringify(gameTimeline));
            localStorage.setItem('mexicanen_current_log', JSON.stringify(currentRoundLog));
            localStorage.setItem('mexicanen_current_target', targetScore.toString());
        }

        function clearActiveGame() {
            localStorage.setItem('mexicanen_game_active', 'false');
            localStorage.removeItem('mexicanen_current_scores');
            localStorage.removeItem('mexicanen_current_timeline');
            localStorage.removeItem('mexicanen_current_log');
            localStorage.removeItem('mexicanen_current_target');
        }

        // --- CONFIGURACIÓN ---
        function addPlayer() {
            const input = document.getElementById('player-input');
            const name = input.value.trim();
            if (name && !players.includes(name)) {
                players.push(name);
                localStorage.setItem('mexicanen_players', JSON.stringify(players));
                input.value = '';
                renderSetupPlayers();
            }
        }

        document.getElementById('player-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addPlayer();
        });

        function removePlayer(name) {
            players = players.filter(p => p !== name);
            localStorage.setItem('mexicanen_players', JSON.stringify(players));
            renderSetupPlayers();
        }

        function renderSetupPlayers() {
            const list = document.getElementById('player-list');
            if (players.length === 0) {
                list.innerHTML = `<li class="text-stone-600 text-center py-3 text-xs italic">Ningún amigo en la mesa...</li>`;
                return;
            }
            list.innerHTML = players.map(player => `
                <li class="flex justify-between items-center bg-stone-900 px-3 py-2 rounded-lg border border-stone-800 shadow-sm">
                    <span class="font-bold text-sm text-stone-200">${player}</span>
                    <button onclick="removePlayer('${player}')" class="text-rose-500 hover:text-rose-400 px-2 flex items-center justify-center">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </li>
            `).join('');
        }

        // --- LÓGICA DEL JUEGO ---
        async function startGame() {
            if (players.length === 0) {
                await showModal({ message: '¡No puedes jugar sin amigos! Añade jugadores.', icon: 'group' });
                return;
            }
            
            const targetInput = document.getElementById('target-score-input');
            targetScore = parseInt(targetInput.value, 10) || 10;
            document.getElementById('score-limit-display').innerText = `Límite: ${targetScore}`;

            scores = {};
            players.forEach(p => scores[p] = 0);
            
            gameTimeline = [JSON.parse(JSON.stringify(scores))];
            currentRoundLog = []; 
            
            document.getElementById('live-log-container').innerHTML = `<div class="text-stone-600 italic py-1 text-center">Los dados están rodando... Sin acciones aún.</div>`;
            
            saveActiveGame();
            showScreen('game-screen');
            renderScoreboard();
        }

        function updateScore(player, amount) {
            scores[player] += amount;
            if (scores[player] < 0) scores[player] = 0;
            
            logLiveEvent(player, amount);
            gameTimeline.push(JSON.parse(JSON.stringify(scores)));
            saveActiveGame();
            renderScoreboard();
        }

        async function updateScoreCustom(player) {
            const userInput = await showModal({ 
                message: `¿Cuántos puntos recibe o pierde ${player}?`, 
                icon: 'dice', 
                type: 'prompt',
                defaultValue: '1'
            });
            const amount = parseInt(userInput, 10);
            if (!isNaN(amount) && amount !== 0) {
                updateScore(player, amount);
            }
        }

        async function undoLastAction() {
            if (gameTimeline.length > 1) {
                gameTimeline.pop(); 
                currentRoundLog.pop(); 
                scores = JSON.parse(JSON.stringify(gameTimeline[gameTimeline.length - 1]));
                saveActiveGame();
                renderScoreboard();
                renderLiveFeed();
            } else {
                await showModal({ message: '¡No hay acciones para deshacer, amigo!', icon: 'undo' });
            }
        }

        function logLiveEvent(player, amount) {
            let iconSvg = '';
            let eventText = '';
            
            if (amount === 1) {
                iconSvg = `<svg class="w-3.5 h-3.5 text-stone-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>`;
                eventText = `<span class="text-stone-300 font-medium">${player}</span> recibe <span class="text-stone-400 font-bold">+1 Punto</span>`;
            } else if (amount === 2) {
                iconSvg = `<svg class="w-3.5 h-3.5 text-orange-500" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M2 18h20 M2 18c0-2 4-3.5 10-3.5s10 1.5 10 3.5 M7 15.5l1.5-6A2 2 0 0 1 10.5 8h3a2 2 0 0 1 2 1.5l1.5 6.5 M8.5 13h7" /></svg>`;
                eventText = `<span class="text-stone-300 font-medium">${player}</span> ¡sufre un <span class="text-amber-500 font-bold">MEXICANO!</span>`;
            } else if (amount > 0) {
                iconSvg = `<svg class="w-3.5 h-3.5 text-red-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>`;
                eventText = `<span class="text-stone-300 font-medium">${player}</span> recibe <span class="text-red-500 font-black">+${amount} Puntos</span>`;
            } else if (amount < 0) {
                iconSvg = `<svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1 1 18 0 9 9 0 0 1-18 0z"/></svg>`;
                eventText = `<span class="text-indigo-400 font-semibold">Corrección para ${player}:</span> <span class="text-indigo-400">${amount} Puntos</span>`;
            }

            const timestamp = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            currentRoundLog.push({ timestamp, iconSvg, eventText });
            renderLiveFeed();
        }

        function renderLiveFeed() {
            const container = document.getElementById('live-log-container');
            if (currentRoundLog.length === 0) {
                container.innerHTML = `<div class="text-stone-600 italic py-1 text-center">Los dados están rodando... Sin acciones aún.</div>`;
                return;
            }
            container.innerHTML = currentRoundLog.map(log => `
                <div class="flex items-start gap-1.5 bg-stone-900/80 p-1.5 rounded-lg border border-stone-800/40">
                    <div class="mt-0.5 flex-shrink-0">${log.iconSvg}</div>
                    <div class="flex-1 text-stone-400 leading-tight">${log.eventText}</div>
                    <span class="text-[8px] text-stone-600 font-mono mt-0.5">${log.timestamp}</span>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function renderScoreboard() {
            const container = document.getElementById('scoreboard-container');
            let limitReached = false;

            container.innerHTML = players.map(player => {
                const score = scores[player];
                const isLosing = score >= targetScore; 
                if (isLosing) limitReached = true;

                const textColor = getScoreColor(score, targetScore);

                return `
                    <div class="flex items-center justify-between p-2 rounded-xl border transition-all ${isLosing ? 'bg-rose-950/30 border-rose-600 shadow-md' : 'bg-stone-900 border-stone-800/80 shadow-sm'}">
                        <div class="flex items-center gap-2 flex-1 min-w-0 pr-1">
                            <span class="font-bold text-sm truncate ${isLosing ? 'text-rose-400' : 'text-stone-200'}">${player}</span>
                            <span style="color: ${textColor};" class="text-base font-black ${isLosing ? 'animate-pulse' : ''} ml-auto bg-stone-950/50 px-2 py-0.5 rounded border border-stone-800/40 min-w-[28px] text-center">${score}</span>
                        </div>
                        <div class="flex gap-1 flex-shrink-0">
                            <button onclick="updateScore('${player}', 1)" class="bg-emerald-600 hover:bg-emerald-500 text-stone-950 font-black w-14 h-9 rounded-lg text-xs active:scale-95 border-b-2 border-emerald-800 flex items-center justify-center">+1</button>
                            <button onclick="updateScore('${player}', 2)" class="bg-amber-500 hover:bg-amber-400 text-stone-950 font-black w-14 h-9 rounded-lg text-xs active:scale-95 border-b-2 border-amber-700 flex items-center justify-center">+2</button>
                            <button onclick="updateScoreCustom('${player}')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black w-11 h-9 rounded-lg text-xs active:scale-95 border-b-2 border-indigo-800 flex items-center justify-center">±X</button>
                        </div>
                    </div>
                `;
            }).join('');

            const endBtn = document.getElementById('end-game-btn');
            if (limitReached) {
                endBtn.className = "flex-1 bg-rose-600 hover:bg-rose-500 text-stone-950 font-black py-3 rounded-xl text-base shadow-lg transition uppercase tracking-widest border-b-4 border-rose-800 animate-bounce flex justify-center items-center gap-2";
                endBtn.innerHTML = `<span>¡TERMINAR JUEGO!</span>`;
            } else {
                endBtn.className = "flex-1 bg-stone-800 hover:bg-stone-700 text-stone-400 font-black py-3 rounded-xl text-sm shadow-lg transition uppercase tracking-widest border-b-4 border-stone-900";
                endBtn.innerHTML = "<span>Terminar Ronda</span>";
            }
        }

        async function endGame() {
            let loser = null;
            let highestScore = -Infinity;

            for (const player in scores) {
                if (scores[player] >= targetScore && scores[player] > highestScore) {
                    highestScore = scores[player];
                    loser = player;
                }
            }

            if (!loser) {
                const confirmEnd = await showModal({ 
                    message: `Nadie ha llegado a ${targetScore} puntos. ¿Seguro que el juego ha terminado?`, 
                    icon: 'help', 
                    type: 'confirm' 
                });
                if (!confirmEnd) return;
                
                let max = -Infinity;
                for (const p in scores) {
                    if(scores[p] > max) { max = scores[p]; loser = p; }
                }
            }

            const session = {
                id: Date.now(),
                game: "Mexicanen",
                date: new Date().toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }),
                scores: { ...scores },
                loser: loser,
                targetScore: targetScore,
                timeline: gameTimeline 
            };

            history.unshift(session);
            localStorage.setItem('mexicanen_timeline_history', JSON.stringify(history));

            await showModal({ message: `¡Ay caramba! ¡${loser} ha perdido el juego con ${scores[loser]} puntos!`, icon: 'skull' });
            clearActiveGame(); 
            showScreen('history-screen');
        }

        // --- HISTORIAL ---
        function renderHistory() {
            activeCharts = {}; 

            const container = document.getElementById('history-container');
            if (history.length === 0) {
                container.innerHTML = `<div class="text-stone-600 text-center py-6 text-xs italic">El cementerio de perdedores (El Muro) aún está vacío...</div>`;
                return;
            }

            container.innerHTML = history.map(session => {
                const scoreString = Object.entries(session.scores)
                    .map(([name, score]) => `${name}: ${score}`)
                    .join(', ');

                return `
                    <div class="bg-stone-900 p-3 rounded-xl border border-stone-800 shadow-sm relative">
                        <div class="flex justify-between items-center text-[10px] text-stone-500 mb-1 pr-6">
                            <span>${session.date} (Límite: ${session.targetScore || 10})</span>
                            <span class="text-rose-400 font-black uppercase tracking-wider">
                                Perdedor: ${session.loser}
                            </span>
                        </div>
                        
                        <button onclick="deleteHistoryItem(${session.id})" title="Borrar juego"
                            class="absolute top-2 right-2 text-stone-500 hover:text-rose-500 transition p-1 flex items-center justify-center">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>

                        <div class="text-xs font-medium text-stone-300 truncate mb-2 leading-tight">${scoreString}</div>
                        
                        <button onclick="toggleChart('${session.id}')" 
                            class="w-full bg-stone-800 hover:bg-stone-750 text-amber-500 font-bold py-1.5 rounded-lg text-[10px] uppercase tracking-wider transition flex justify-center items-center gap-1">
                            <span>¡Ver historial de juego! (Gráfico)</span>
                        </button>
                        <div id="chart-container-${session.id}" class="hidden mt-2 pt-2 border-t border-stone-800 h-56">
                            <canvas id="canvas-${session.id}"></canvas>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deleteHistoryItem(id) {
            const confirmDelete = await showModal({ message: '¿Seguro que quieres borrar este juego del El Muro?', icon: 'trash', type: 'confirm' });
            if (confirmDelete) {
                if (activeCharts[id]) {
                    activeCharts[id].destroy();
                    delete activeCharts[id];
                }
                history = history.filter(s => s.id !== id);
                localStorage.setItem('mexicanen_timeline_history', JSON.stringify(history));
                renderHistory();
            }
        }

        function toggleChart(id) {
            const container = document.getElementById(`chart-container-${id}`);
            const isHidden = container.classList.contains('hidden');
            if (isHidden) {
                container.classList.remove('hidden');
                setTimeout(() => { buildChart(id); }, 5); 
            } else {
                container.classList.add('hidden');
            }
        }

        function buildChart(id) {
            if (activeCharts[id]) return;

            const session = history.find(s => s.id == id);
            const ctx = document.getElementById(`canvas-${id}`).getContext('2d');
            
            const gamePlayers = Object.keys(session.timeline[0]);
            const labels = session.timeline.map((_, index) => `Turno ${index}`);
            const colors = ['#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#facc15', '#a855f7', '#14b8a6'];

            const datasets = gamePlayers.map((player, idx) => {
                return {
                    label: player,
                    data: session.timeline.map(snapshot => snapshot[player] || 0),
                    borderColor: colors[idx % colors.length],
                    backgroundColor: colors[idx % colors.length],
                    borderWidth: 2,
                    pointRadius: 1.5,
                    tension: 0.15 
                };
            });

            activeCharts[id] = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, 
                    scales: {
                        x: { 
                            grid: { color: '#292524' }, 
                            ticks: { color: '#78716c', font: { size: 9, weight: 'bold' } }
                        },
                        y: { 
                            grid: { color: '#292524' }, 
                            ticks: { color: '#a8a29e', stepSize: 1, font: { size: 9, weight: 'bold' } },
                            suggestedMax: session.targetScore || 10 
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#d6d3d1', font: { weight: 'black', size: 10 } },
                            position: 'top'
                        }
                    }
                }
            });
        }

        async function clearHistory() {
            const confirmClear = await showModal({ message: '¿Seguro que quieres borrar todo el historial?', icon: 'warning', type: 'confirm' });
            if (confirmClear) {
                Object.values(activeCharts).forEach(chart => chart.destroy());
                activeCharts = {};
                history = [];
                localStorage.removeItem('mexicanen_timeline_history');
                renderHistory();
            }
        }

        async function exportHistory() {
            if (history.length === 0) {
                await showModal({ message: '¡No hay datos para exportar, amigo!', icon: 'box' });
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(history, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `mexicanen_data_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function initResizableLog() {
            const resizer = document.getElementById('log-resizer');
            const logContainer = document.getElementById('live-log-container');
            let isResizing = false;

            const savedHeight = localStorage.getItem('mexicanen_log_height');
            if (savedHeight) logContainer.style.maxHeight = savedHeight;

            function startResize() { isResizing = true; document.body.style.cursor = 'ns-resize'; }
            function stopResize() { 
                if (isResizing) {
                    isResizing = false; 
                    document.body.style.cursor = 'default'; 
                    localStorage.setItem('mexicanen_log_height', logContainer.style.maxHeight);
                }
            }
            function handleResize(clientY) {
                if (!isResizing) return;
                const rect = logContainer.getBoundingClientRect();
                let newHeight = clientY - rect.top;
                if (newHeight < 48) newHeight = 48;   
                if (newHeight > 320) newHeight = 320; 
                logContainer.style.maxHeight = `${newHeight}px`;
            }

            resizer.addEventListener('mousedown', startResize);
            document.addEventListener('mousemove', (e) => handleResize(e.clientY));
            document.addEventListener('mouseup', stopResize);

            resizer.addEventListener('touchstart', startResize);
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) handleResize(e.touches[0].clientY);
            });
            document.addEventListener('touchend', stopResize);
        }

        function checkAndRestoreActiveGame() {
            if (localStorage.getItem('mexicanen_game_active') === 'true') {
                scores = JSON.parse(localStorage.getItem('mexicanen_current_scores')) || {};
                gameTimeline = JSON.parse(localStorage.getItem('mexicanen_current_timeline')) || [];
                currentRoundLog = JSON.parse(localStorage.getItem('mexicanen_current_log')) || [];
                targetScore = parseInt(localStorage.getItem('mexicanen_current_target'), 10) || 10;
                
                document.getElementById('score-limit-display').innerText = `Límite: ${targetScore}`;
                showScreen('game-screen');
                renderScoreboard();
                renderLiveFeed();
            }
        }

        renderSetupPlayers();
        initResizableLog();
        checkAndRestoreActiveGame();
    </script>
</body>
</html>
